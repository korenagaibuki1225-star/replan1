<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RePlan</title>
<style>
:root{--bg:#f2f5fb;--card:#fff;--tx:#1b2233;--sub:#6a7489;--line:#e4e9f3;--soft:#eaf0fb;--ac:#3f6df0;--ac2:#18b5a4;--l0:#1fae83;--l1:#3f6df0;--l2:#eb9a2a;--l3:#e5586c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131f;--card:#171e2e;--tx:#e8ecf6;--sub:#98a3bb;--line:#26304a;--soft:#1f2a42}}
:root[data-theme="dark"]{--bg:#0e131f;--card:#171e2e;--tx:#e8ecf6;--sub:#98a3bb;--line:#26304a;--soft:#1f2a42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 -apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
#v{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:0;letter-spacing:.02em}h2{font-size:20px;margin:6px 0 2px}h3{font-size:15px;margin:0 0 8px}
small,.sub{color:var(--sub);font-size:13px}.sub{margin:0 0 14px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ic{border:1px solid var(--line);background:var(--card);color:var(--ac);border-radius:999px;padding:6px 14px;font:inherit;font-weight:700}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(30,50,100,.06)}
.hero{position:relative;overflow:hidden;padding:22px 20px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -15%,var(--lc),transparent 62%);opacity:.2}
.hero>*{position:relative}
.big{font-size:46px;font-weight:800;line-height:1.2;color:var(--lc);margin:2px 0 10px}
.meter{display:flex;gap:6px;margin-bottom:16px}.meter i{flex:1;height:8px;border-radius:9px;background:var(--line)}.meter i.on{background:var(--lc)}
.prop{font-size:18px;font-weight:700;margin:0 0 10px;line-height:1.5}
.hl{list-style:none;padding:0;margin:0 0 16px}.hl li{padding:7px 0 7px 14px;border-left:3px solid var(--lc);margin-bottom:6px;background:var(--soft);border-radius:0 10px 10px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.btn2{display:block;width:100%;border:0;border-radius:16px;padding:13px;font:inherit;font-weight:700;color:var(--tx);background:var(--soft);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border-radius:16px;padding:10px 4px;text-align:center}.stats b{display:block;font-size:17px}.stats small{font-size:11px}
.lock{position:relative;overflow:hidden;border:1.5px dashed var(--line);box-shadow:none;background:transparent}
.lock p{filter:blur(4px);margin:6px 0;user-select:none}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}.val{font-weight:800;color:var(--ac);font-size:18px}
input[type=range]{width:100%;accent-color:var(--ac);height:34px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 15px;font:inherit}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tk{display:flex;gap:6px;margin-bottom:8px}.tk input,.tk select{min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:9px;font:inherit}
.tn{flex:1}.tm{width:58px}.x{border:0;background:none;color:var(--sub);font-size:20px}
.sec{border-left:5px solid var(--sc)}.it{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}.it:first-of-type{border-top:0}.it em{font-style:normal;color:var(--sub)}.it b{color:var(--sc)}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.bars{display:flex;gap:12px;align-items:flex-end;height:90px;margin-top:10px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--sub)}.bars i{display:block;border-radius:10px 10px 4px 4px;margin-bottom:4px}
.ld{text-align:center;padding:90px 0}.orb{width:76px;height:76px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));animation:pu 1.1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.18);opacity:.6}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:70px}.m{max-width:84%;padding:11px 14px;border-radius:18px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:5px}.m.a{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.m button{display:block;margin-top:8px;border:0;border-radius:12px;background:var(--soft);color:var(--ac);padding:8px 12px;font:inherit;font-weight:700}
.cin{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 12px}
.cin>div{max-width:480px;margin:0 auto}.cin .chips{margin:0 0 8px;flex-wrap:nowrap;overflow-x:auto}.cin .chip{white-space:nowrap;font-size:13px;padding:7px 12px}
.cin form{display:flex;gap:8px}.cin input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:11px 16px;font:inherit}.cin button.s{border:0;border-radius:999px;background:var(--ac);color:#fff;padding:0 18px;font:inherit;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;margin:0 auto}nav button{flex:1;height:58px;border:0;background:none;color:var(--sub);font:inherit;font-size:11px}nav button span{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--ac);font-weight:700}
#sh{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:flex-end;z-index:9}#sh.o{display:flex}
#sh>div{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0 14px}td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:center}td:first-child,th:first-child{text-align:left}th{color:var(--sub);font-weight:600}td:last-child{color:var(--ac);font-weight:700}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:10}
</style></head><body>
<div id="v"></div>
<nav><div id="nv"></div></nav>
<div id="sh" onclick="if(event.target==this)cl()"><div>
<h2>RePlan Plus</h2><p class="sub">「予定を管理する」から「生活を最適化してもらう」へ。</p>
<table><tr><th></th><th>無料</th><th>Plus</th></tr>
<tr><td>今日の負荷判定・組み替え</td><td>○</td><td>○</td></tr>
<tr><td>明日の予測</td><td>1日先</td><td>7日先</td></tr>
<tr><td>AIとの相談</td><td>1日5回</td><td>無制限</td></tr>
<tr><td>疲れやすいパターンの発見</td><td>–</td><td>○</td></tr>
<tr><td>締切から逆算した自動計画</td><td>–</td><td>○</td></tr>
<tr><td>カレンダー連携の自動最適化</td><td>–</td><td>○</td></tr>
<tr><td>月ごとの生活負荷レポート</td><td>–</td><td>○</td></tr></table>
<button class="btn" onclick="cl();toast('これはデモです。課金はまだ実装していません')">7日間無料で試す（デモ）</button>
<button class="btn2" onclick="cl()">あとで</button></div></div>
<div id="ts"></div>
<script>
const KEY='replan_v1',$=id=>document.getElementById(id);
const D={sleep:5.5,fatigue:8,mood:4,classes:3,shift:true,end:23,early:false,soft:false,touched:false,tasks:[{n:'レポート',m:60,p:2},{n:'資格勉強',m:45,p:1},{n:'部屋の片づけ',m:20,p:0}],chat:[]};
let S;try{S={...D,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){S={...D}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV=['ゆとりあり','ふつう','やや高い','高い'],fmt=h=>Math.floor(h)%24+':'+(h%1?'30':'00'),r5=x=>Math.max(5,Math.round(x/5)*5);
let tab='home';
function toast(t){const e=$('ts');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
function openPlus(){$('sh').classList.add('o')}function cl(){$('sh').classList.remove('o')}

function calc(){
 const{sleep:sl,fatigue:f,classes:c,shift,end,early,soft,mood}=S;
 let lv=f>=8&&sl<6?3:(f>=8||sl<5)?2:f<=4?0:1;
 if(lv==1&&((shift&&end>=23)||c>=4||mood<=3))lv=2;
 const fac=[1.2,1,.6,.42][lv],keep=[],cut=[],later=[],drop=[];
 S.tasks.forEach(t=>{
  const q={...t,to:r5(t.m*fac)};
  if(soft){t.p==2?cut.push({...t,to:Math.min(15,t.m)}):later.push(t);return}
  if(t.p==2)(lv>=2?cut:keep).push(q);
  else if(t.p==1)lv==3?later.push(t):(lv==2?cut:keep).push(q);
  else lv==3?drop.push(t):lv==2?later.push(t):keep.push({...t,to:t.m});
 });
 const total=(c>0?1:0)+(shift?1:0)+S.tasks.length,after=total-later.length-drop.length;
 const cutoff=fmt(shift?S.end+.5:(lv>=2||soft?22.5:23)-(early?.5:0));
 const heavy=lv>=2||soft;
 const reason=soft?'「今日はもう頑張らない」モードです。期限が近いものだけ少し触れて、あとは休む日にします。':
  lv==3?`睡眠が${sl}時間で疲労度が${f}のため、長時間の勉強は効率が落ちやすい日です。短く区切って、残りは明日に回したほうが結果的に早く終わります。`:
  lv==2?'疲れが残っていて予定も詰まりぎみです。勉強は短めに区切るほうが続きます。':
  lv==1?'状態は安定しています。いつも通りのペースで大丈夫です。':'体力に余裕があります。今日は少し多めに進めるチャンスです。';
 const prop=soft||lv>=2?`今日は予定を${total}つから${after}つに減らします`:lv==1?'今日はいつも通りで大丈夫です':'余裕があるので、少し多めに進めて大丈夫です';
 const hl=[...cut.map(t=>`${esc(t.n)}は${t.m}分 → ${t.to}分`),...later.map(t=>`${esc(t.n)}は明日に回します`),...(lv==0?keep.slice(0,1).map(t=>`${esc(t.n)}を${t.to}分まで進めてOK`):[]),`${cutoff}以降は予定を入れません`].slice(0,4);
 return{lv,keep,cut,later,drop,total,after,cutoff,reason,prop,hl,soft};
}
function tmr(a){
 const pm=a.later.reduce((s,t)=>s+t.m,0);let t=1+(pm>=45?1:0)+(S.early?1:0);if(!pm&&!S.early)t=0;
 return{pm,t:Math.min(3,t)};
}
const teaser=`<div class="card lock" onclick="openPlus()"><h3>🔒 あなたの疲れやすいパターン <small>Plus</small></h3><p>バイトが23時以降の翌日は、疲労度が平均+2になりがちです。</p><small>1週間分のデータからAIが見つけます →</small></div>`;
const rng=(k,l,mn,mx,st,sf)=>`<div class="row"><b>${l}</b><span class="val" id="o_${k}">${S[k]}${sf}</span></div><input type="range" min="${mn}" max="${mx}" step="${st}" value="${S[k]}" oninput="sl('${k}',this.value,'${sf}')">`;
const chips=(k,arr,fn)=>`<div class="chips">${arr.map(([v,l])=>`<button class="chip ${S[k]==v?'on':''}" onclick="set('${k}',${v})">${l}</button>`).join('')}</div>`;
function sl(k,v,sf){S[k]=+v;S.touched=true;$('o_'+k).textContent=v+sf;save()}
function set(k,v){S[k]=v;S.touched=true;save();render()}
function up(i,k,v){S.tasks[i][k]=v;S.touched=true;save()}
function del(i){S.tasks.splice(i,1);save();render()}
function add(){const n=$('nn').value.trim();if(!n)return toast('タスク名を入れてください');S.tasks.push({n,m:+$('nm').value||30,p:+$('np').value});S.touched=true;save();render()}

const V={
home(){const a=calc();return`<div class="hd"><div><small>${new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'})}</small><h1>RePlan</h1></div><button class="ic" onclick="openPlus()">✦ Plus</button></div>
<div class="card hero" style="--lc:var(--l${a.lv})"><small>今日の負荷</small><div class="big">${LV[a.lv]}</div><div class="meter">${[0,1,2,3].map(i=>`<i class="${i<=a.lv?'on':''}"></i>`).join('')}</div>
<p class="prop">${a.prop}</p><ul class="hl">${a.hl.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn" onclick="go('plan')">調整後のプランを見る</button><button class="btn2" onclick="go('input')">今日の状態を更新</button></div>
<div class="stats"><div><b>${S.sleep}h</b><small>睡眠</small></div><div><b>${S.fatigue}/10</b><small>疲労度</small></div><div><b>${a.total}→${a.after}</b><small>予定</small></div><div><b>${S.tasks.length}</b><small>課題</small></div></div>
${S.touched?'':'<p class="sub" style="text-align:center">サンプルの状態で表示中。「入力」で自分の状態に変えられます。</p>'}${teaser}`},
input(){return`<h2>今日の状態</h2><p class="sub">スライダーとボタンだけ。10秒で終わります。</p>
<div class="card">${rng('sleep','睡眠',3,10,.5,'時間')}${rng('fatigue','疲労度',1,10,1,'/10')}${rng('mood','気分',1,10,1,'/10')}</div>
<div class="card"><b>授業</b>${chips('classes',[0,1,2,3,4,5].map(n=>[n,n+'コマ']))}<b>バイト</b>${chips('shift',[[false,'なし'],[true,'あり']])}
${S.shift?`<small>終わる時間</small>${chips('end',[20,21,22,23,24].map(n=>[n,n%24+'時']))}`:''}<b>明日の朝</b>${chips('early',[[false,'ふつう'],[true,'1限あり']])}</div>
<div class="card"><b>課題・やること</b><p class="sub">分数と重要度を決めておくと、AIが削る順番を決めます。</p>
${S.tasks.map((t,i)=>`<div class="tk"><input class="tn" value="${esc(t.n)}" onchange="up(${i},'n',this.value)"><input class="tm" type="number" value="${t.m}" min="5" step="5" onchange="up(${i},'m',+this.value)"><select onchange="up(${i},'p',+this.value)">${[[2,'期限近い'],[1,'ふつう'],[0,'低め']].map(([v,l])=>`<option value="${v}" ${t.p==v?'selected':''}>${l}</option>`).join('')}</select><button class="x" onclick="del(${i})">×</button></div>`).join('')}
<div class="tk"><input class="tn" id="nn" placeholder="例：ES下書き"><input class="tm" id="nm" type="number" value="30"><select id="np"><option value="1">ふつう</option><option value="2">期限近い</option><option value="0">低め</option></select><button class="x" onclick="add()">＋</button></div></div>
<button class="btn" onclick="go('plan',1)">AIに組み替えてもらう</button>`},
plan(){const a=calc(),r=(x,s)=>`<div class="it"><span>${x}</span><em>${s||''}</em></div>`,
 sec=(t,c,it)=>it.length?`<div class="card sec" style="--sc:var(${c})"><h3>${t}</h3>${it.join('')}</div>`:'';
 const fixed=[S.classes>0&&r('授業',S.classes+'コマ'),S.shift&&r('バイト','〜'+S.end%24+'時')].filter(Boolean);
 return`<h2>AIが今日の予定を調整しました</h2><p class="sub">負荷：${LV[a.lv]}${a.soft?'（頑張らないモード）':''}</p>
${a.soft?`<div class="note">「今日はもう頑張らない」モード中です <button class="x" style="font-size:13px;color:var(--ac)" onclick="S.soft=false;save();render()">戻す</button></div>`:''}
${sec('残す','--l0',[...fixed,...a.keep.map(t=>r(esc(t.n),t.to+'分'))])}
${sec('短縮する','--l2',a.cut.map(t=>r(esc(t.n),`${t.m}分 → <b>${t.to}分</b>`)))}
${sec('後回しにする','--l1',a.later.map(t=>r(esc(t.n),'明日へ')))}
${sec('やらなくていい','--sub',a.drop.map(t=>r(esc(t.n),'今日はなし')))}
<div class="card"><h3>なぜこの判断？</h3><p style="margin:0">${a.reason}</p></div>
<div class="card"><h3>🌙 ${a.cutoff}以降は予定なし</h3><p style="margin:0" class="sub">${S.early?'明日は1限なので、寝る準備は手短に。':'睡眠を優先して、画面もそろそろ置きましょう。'}</p></div>
<div class="card lock" onclick="openPlus()"><h3>🔒 カレンダーに自動で反映 <small>Plus</small></h3><small>組み替えた結果をGoogleカレンダーへ。毎朝自動で最適化します。</small></div>`},
tomorrow(){const a=calc(),{pm,t}=tmr(a),h=[t,Math.max(0,t-1),1];
 return`<h2>明日の予定</h2><p class="sub">今日の判断を踏まえた予測です。</p>
<div class="card hero" style="--lc:var(--l${t})"><small>明日の負荷（予測）</small><div class="big" style="font-size:36px">${LV[t]}</div>
<p style="margin:0">${pm?`今日回した分が${pm}分あります。休んだ明日のほうが短時間で終わります。`:'今日から持ち越しはありません。明日は軽く始められそうです。'}${S.early?'<br>1限があるので、夜は早めに切り上げましょう。':''}</p></div>
<div class="card sec" style="--sc:var(--l1)"><h3>明日に回したタスク</h3>${a.later.length?a.later.map(t=>`<div class="it"><span>${esc(t.n)}</span><em>${t.m}分</em></div>`).join(''):'<small>なし</small>'}</div>
<div class="card"><h3>これから3日の目安</h3><div class="bars">${['明日','あさって','3日後'].map((l,i)=>`<div><i style="height:${24+h[i]*16}px;background:var(--l${h[i]})"></i>${l}</div>`).join('')}</div></div>
<div class="card lock" onclick="openPlus()"><h3>🔒 7日先まで予測 <small>Plus</small></h3><small>締切から逆算して、負荷が重なる日を先に分散します。</small></div>`},
chat(){const q=['今日はもう勉強したくない','バイトで帰るのが23時です','明日1限があります'];
 return`<h2>AIに相談</h2><p class="sub">話しかけると、プランを組み直します。</p><div class="msgs">${S.chat.map(m=>`<div class="m ${m.r}">${esc(m.t)}${m.b?'<button onclick="go(\'plan\')">プランを見る</button>':''}</div>`).join('')}</div>
<div class="cin"><div><div class="chips">${q.map(x=>`<button class="chip" onclick="say('${x}')">${x}</button>`).join('')}</div><form onsubmit="event.preventDefault();say($('ci').value)"><input id="ci" placeholder="今日の気持ちや予定の変更…" autocomplete="off"><button class="s">送信</button></form></div></div>`}
};
function bot(t){
 const n=(t.match(/(\d{1,2})\s*(時|:)/)||[])[1];let b=1,x;
 if(/1限|一限|朝早|早起き/.test(t)){S.early=true;x=`明日1限ですね。睡眠を優先するプランに変えました。${calc().cutoff}以降は予定を入れず、寝る準備は手短にしましょう。`}
 else if(n&&/バイト|帰|終わ|シフト/.test(t)){S.shift=true;S.end=Math.min(24,Math.max(18,+n<=5?24:+n));x=`バイトが${n}時までですね。帰宅後は何も入れない前提で、勉強は短く組み直しました。${calc().cutoff}以降は休む時間です。`}
 else if(/バイト.*(休|なし|ない|なくな)/.test(t)){S.shift=false;x='バイトがなくなったんですね。その分、無理のない範囲で夜に少し余裕ができました。'}
 else if(/したくない|やりたくない|無理|しんどい|疲れ|だるい|もういい/.test(t)){S.soft=true;x='今日は無理に追加しなくて大丈夫です。提出期限が近いものだけ10〜15分進めて、残りは明日に回しましょう。'}
 else if(/ありがと|助かる/.test(t)){b=0;x='どういたしまして。今日は早めに休んでくださいね。'}
 else{b=0;x=`${calc().prop}。「勉強したくない」「バイトが23時まで」「明日1限」のように話しかけると、プランを組み直します。`}
 save();return{r:'a',t:x,b};
}
function say(t){t=(t||'').trim();if(!t)return;S.chat.push({r:'u',t});S.chat=S.chat.slice(-30);save();render();
 setTimeout(()=>{S.chat.push(bot(t));save();if(tab=='chat')render()},650)}
function go(t,anim){tab=t;nav();if(anim){$('v').innerHTML='<div class="ld"><div class="orb"></div><p id="lt">状態を分析中…</p></div>';window.scrollTo(0,0);
 setTimeout(()=>{const e=$('lt');if(e)e.textContent='予定を組み替え中…'},550);setTimeout(()=>{if(tab==t)render()},1150)}else render()}
function nav(){$('nv').innerHTML=[['home','🏠','ホーム'],['input','✍️','入力'],['plan','✨','プラン'],['tomorrow','🌙','明日'],['chat','💬','相談']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}
function render(){nav();$('v').innerHTML=V[tab]();if(tab=='chat'){if(!S.chat.length){S.chat.push({r:'a',t:`今日の状態は見ておきました。${calc().prop}。気になることがあれば話しかけてください。`});save();return render()}window.scrollTo(0,document.body.scrollHeight)}else if(document.activeElement===document.body)window.scrollTo(0,0)}
render();
</script></body></html>
